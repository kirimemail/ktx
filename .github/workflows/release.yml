name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        goos:
          - linux
          - darwin
          - windows
        goarch:
          - amd64
          - arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Get dependencies
        run: go mod download

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then
            ext=".exe"
          fi
          name="ktx-${GOOS}-${GOARCH}${ext}"
          go build -ldflags="-s -w" -o "$name" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ktx-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ktx-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums
        run: |
          cd artifacts
          for f in ktx-*-amd64.exe ktx-*-arm64.exe ktx-*-amd64 ktx-*-arm64; do
            if [ -f "$f" ]; then
              sha256sum "$f" > "${f}.sha256sum"
            fi
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ktx-linux-amd64
            artifacts/ktx-linux-arm64
            artifacts/ktx-darwin-amd64
            artifacts/ktx-darwin-arm64
            artifacts/ktx-windows-amd64.exe
            artifacts/ktx-windows-arm64.exe
            artifacts/ktx-linux-amd64.sha256sum
            artifacts/ktx-linux-arm64.sha256sum
            artifacts/ktx-darwin-amd64.sha256sum
            artifacts/ktx-darwin-arm64.sha256sum
            artifacts/ktx-windows-amd64.exe.sha256sum
            artifacts/ktx-windows-arm64.exe.sha256sum
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update package.json version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          node -e '
            const p = require("./npm/package.json");
            p.version = process.argv[1];
            const fs = require("fs");
            fs.writeFileSync(
              "./npm/package.json",
              JSON.stringify(p, null, 2) + "\n",
            );
          ' "$VERSION"

      - name: Publish to npm
        run: |
          cd npm
          npm publish --access public --provenance
